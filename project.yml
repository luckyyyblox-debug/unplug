name: Reversio
options:
  bundleIdPrefix: com.reversio
targets:
  Reversio:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Reversio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reversio.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reversio
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
